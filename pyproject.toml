[build-system]
requires = ["setuptools>=77", "setuptools-scm>=7"]
build-backend = "setuptools.build_meta"

[project]
name = "topicexplorer"
dynamic = ["version"]
description = "InPhO Topic Explorer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "The Indiana Philosophy Ontology (InPhO) Project", email = "inpho@indiana.edu" },
]
maintainers = [
    { name = "Jaimie Murdock", email = "jaimie@inphoproject.org" },
]
keywords = ["topic modeling", "lda", "visualization"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Bottle",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.12"
dependencies = [
    "bottle>=0.12.0,<0.13.0",
    "decorator>=4.0.5",
    "defusedxml>=0.7.1",
    "langdetect>=1.0.0",
    "matplotlib>=2.0.0",
    "nltk>=3.0.0,<4.0.0",
    "notebook>=4.0.0",
    "numpy<2.0.0",
    "packaging",
    "Paste>=3.8",
    "pdfminer.six>=20240706",
    "profilehooks>=1.8.0",
    "progressbar2>=3.18.0",
    "pybtex>=0.21",
    "pystache>=0.5.4",
    "requests>=2.32.4",
    "scikit-learn>=0.18.1",
    "scipy>=0.19.0",
    "snakeviz>=0.4.0",
    "sortedcontainers>=1.5.7",
    "ujson>=5.4.0",
    "Unidecode",
    "vsm>=1.0.0b1",
    "waitress>=3.0.1",
    "webtest>=2.0.29",
    "wget>=3.2",

    # Windows-only
    'pywin32>=220; sys_platform == "win32"',
    'win_unicode_console; sys_platform == "win32"',

    # Security-pinned transitive deps (from your requirements.txt)
    "anyio>=4.4.0",
    "fonttools>=4.61.0",
    "mistune>=2.0.1",
    "pillow>=10.3.0",
    "pygments>=2.7.4",
    "tornado>=6.5.3",
    "urllib3>=2.6.0",
    "zipp>=3.19.1"
]

[project.urls]
Homepage = "https://www.hypershelf.org"
Download = "http://github.com/inpho/topic-explorer"

[project.scripts]
vsm = "topicexplorer.__main__:vsm"
topicexplorer = "topicexplorer.__main__:main"
htutils = "topicexplorer.lib.hathitrust:main"

# Optional extras (grouped per your setup.cfg)
[project.optional-dependencies]
htrc = [
    "htrc-feature-reader>=1.92",
    "htrc"
]

[dependency-groups]
dev = [
    "coverage",
    "pytest",
]

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["topicexplorer*"]

# setuptools-scm config
[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "dirty-tag"
fallback_version = "0.0.0"
